# Cloud Run service reference (Knative Serving v1)
# Apply when ready:
#   gcloud run services replace cloudrun.yaml --region=asia-northeast3
#
# Or use: scripts/deploy-cloudrun.sh
#
# Replace IMAGE_URI before apply, e.g.:
#   asia-northeast3-docker.pkg.dev/PROJECT_ID/washon-business/washon-business:latest

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: washon-business
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-northeast3-docker.pkg.dev/PROJECT_ID/washon-business/washon-business:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: NEXT_PUBLIC_API_URL
              value: https://api.autoon.kr/api/v1
            - name: NEXT_PUBLIC_USE_MOCK
              value: "false"
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 30
